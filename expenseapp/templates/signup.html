<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        a {
            text-decoration: none;
            color: #3498db;
            margin-right: 15px;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Form Styles */
        form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        form label {
            font-weight: bold;
        }

        form select, form input {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
        }

        form input:focus, form select:focus {
            border-color: #3498db;
        }

        form button {
            padding: 6px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        form button:hover {
            background-color: #2980b9;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e1f0ff;
        }

        button[type="submit"] {
            background-color: #e74c3c;
            padding: 5px 10px;
            border-radius: 4px;
        }

        button[type="submit"]:hover {
            background-color: #c0392b;
        }

        /* Add Expense link */
        a[href$="add_expense"] {
            display: inline-block;
            margin: 10px 0;
            padding: 8px 15px;
            background-color: #2ecc71;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        a[href$="add_expense"]:hover {
            background-color: #27ae60;
        }

        /* Responsive */
        @media (max-width: 600px) {
            form {
                flex-direction: column;
            }

            th, td {
                font-size: 14px;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

<h2>Signup</h2>

<form method="POST">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit">Signup</button>
</form>

{% if form.errors %}
<div style="color:red">
    {{ form.errors }}
</div>
{% endif %}

<a href="{% url 'login' %}">Login</a>

</body>
</html>
